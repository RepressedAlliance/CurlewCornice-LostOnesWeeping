<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>canon card</title>
<style>html, body { margin: 0; background: transparent; } canvas { position: absolute; left: 0; top: 0; }</style>
</head><body><script type="module">
// One card from web/lib/card.js at 1500 px wide on a transparent page, for the set pack (art/canon/).
import { drawCard, loadCardFonts, CARD_RATIO } from '../lib/card.js';
await loadCardFonts();
const q = new URLSearchParams(location.search), opts = JSON.parse(q.get('opts') || '{}');
const c = document.createElement('canvas'); c.width = 1500; c.height = Math.round(1500 / CARD_RATIO);
document.body.appendChild(c); drawCard(c, opts);
window.__ready = true;
</script></body></html>
